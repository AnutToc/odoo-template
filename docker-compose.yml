version: "3"
services:
  init-odoo:
    image: odoo:13.0
    user: root
    command: chown -R odoo:odoo /var/lib/odoo
    volumes:
      - odoo_lib:/var/lib/odoo

  odoo:
    image: odoo:13.0 # Specify the Odoo image here
    restart: unless-stopped
    volumes:
      - odoo_lib:/var/lib/odoo
      - ./modules:/mnt/extra-addons
      - ./third-party-modules:/mnt/third-party-modules
      - ./oca-modules:/mnt/oca-modules
    depends_on:
      init-odoo:
        condition: service_completed_successfully
      db:
        condition: service_started
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - POSTGRES_DB=postgres
    links:
      - db
    command: --log-handler :DEBUG
  db:
    image: postgres:15
    restart: unless-stopped
    ports:
      - 8061:5432
    volumes:
      - odoo13_postgres_data:/var/lib/postgresql/data # Rename postgres volumn with odoo version
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata

volumes:
  odoo_lib:
  odoo13_postgres_data: # Use same db volumns
